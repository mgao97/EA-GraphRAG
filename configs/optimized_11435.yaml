project:
  name: EA-GraphRAG
  phase: 1
  seed: 42
  results_dir: results
  log_dir: logs
dataset:
  name: hotpotqa
  path: data/raw/hotpot_dev_v1.1.json
  synthetic_path: data/sample_hotpotqa.json
  limit: 200
graph:
  build_from: contexts
  min_entity_len: 2
  max_entities_per_passage: 16
  # Degree-based graph pruning (hub removal). Entity nodes whose degree exceeds
  # this threshold are removed at build time, breaking the dense cliques formed
  # by shared-entity bridge edges. Titles (retrieval targets) are kept. Set 0 to
  # disable. This is an optimisation of the EA-GraphRAG retrieval graph.
  max_degree: 100
embedding:
  # text-embedding-3-small served by bianxie.ai through the local proxy
  # (minimax_proxy.py :30001, which forwards /v1/embeddings to bianxie.ai).
  backend: openai
  model: text-embedding-3-small
  dim: 1536
  cache_dir: .cache/embeddings
  base_url: http://127.0.0.1:30001/v1
  api_key_env: BIANXIE_API_KEY
llm:
  backend: ollama
  provider: ollama
  model: qwen2.5:14b
  temperature: 0.0
  base_url: http://127.0.0.1:11435/v1
  api_key: ollama
  max_tokens: 512
controller:
  type: eac
  max_iterations: 6
  sufficiency:
    tau_sem: 0.2
    tau_reason: 0.66
    tau_cons: 0.85
    marginal_gain_threshold: 0.02
  weights:
    semantic: 0.3
    structural: 0.2
    reasoning: 0.4
    consistency: 0.1
  ablation:
    use_semantic: true
    use_structural: true
    use_reasoning: true
    use_consistency: true
retrieval:
  top_k_retrieve: 5
  expand_hops: 2
  bridge_max_hops: 3
  # Beam width for EXPAND (graph-pruning / best-first expansion). Each hop keeps
  # only the top-k most query-relevant neighbours instead of the full BFS
  # neighbourhood, bounding the evidence set size. Set 0 for unbounded (legacy).
  max_nodes_per_hop: 30
baselines:
  fixed_hops:
  - 1
  - 2
  - 3
  - 4
  include:
  - bm25
  - fixed_hop_1
  - fixed_hop_2
  - fixed_hop_3
  - fixed_hop_4
  - graphrag
  - react_graphrag
  - ea_graphrag
  - oracle
# Cross-dataset generalisation (E8). Each entry names a dataset and its path;
# the runner loads it via load_hotpotqa-style loaders and reuses the same
# graph/method build pipeline.
cross_datasets:
  - name: 2wikimultihopqa
    path: data/raw/2wikimultihopqa/questions.json
  - name: musique
    path: data/raw/musique/questions.json
experiments:
  phase1:
  - e1
  - e3
  - e5
  - e7
  - e8
