# Smoke-test config for EA-GraphRAG against the locally-running Ollama server.
#
# This config uses the `qwen2.5:14b` model. It is the default model for this
# project (see deploy/start_ollama.sh, which now pulls qwen2.5:14b by default).
#
# Use this when:
#   * You want a quick end-to-end run against the project's standard model.
#   * You want to verify the EA-GraphRAG ↔ Ollama plumbing on the 14B model.
#
# For the full HotpotQA pipeline, use configs/local_sglang_qwen35.yaml which
# also targets Ollama + qwen2.5:14b (the file name is historical; the actual
# backend is Ollama, not SGLang — see the comment in that file).

project:
  name: EA-GraphRAG-ollama-qwen2.5-14b
  phase: 1
  seed: 42
  results_dir: results
  log_dir: logs

dataset:
  name: hotpotqa
  path: data/raw/hotpot_dev_v1.1.json
  synthetic_path: data/sample_hotpotqa.json
  limit: 200  # smoke-test size

graph:
  build_from: contexts
  min_entity_len: 2
  max_entities_per_passage: 16

embedding:
  # text-embedding-3-small served by bianxie.ai through the local proxy
  # (minimax_proxy.py :30001, which forwards /v1/embeddings to bianxie.ai).
  backend: openai
  model: text-embedding-3-small
  dim: 1536
  cache_dir: .cache/embeddings
  base_url: http://127.0.0.1:30001/v1
  api_key_env: BIANXIE_API_KEY

llm:
  backend: openai
  provider: ollama
  model: qwen2.5:14b
  auto_discover_model: false
  temperature: 0.0
  max_tokens: 512
  base_url: http://127.0.0.1:11434/v1

controller:
  type: eac
  max_iterations: 6
  sufficiency:
    tau_sem: 0.55
    tau_reason: 0.66
    tau_cons: 0.85
    marginal_gain_threshold: 0.02
  weights:
    semantic: 0.3
    structural: 0.2
    reasoning: 0.4
    consistency: 0.1
  ablation:
    use_semantic: true
    use_structural: true
    use_reasoning: true
    use_consistency: true

retrieval:
  top_k_retrieve: 5
  expand_hops: 2
  bridge_max_hops: 3

baselines:
  fixed_hops: [1, 2, 3, 4]
  include: ["bm25", "fixed_hop_1", "fixed_hop_2", "fixed_hop_3", "fixed_hop_4", "graphrag", "react_graphrag", "ea_graphrag"]

experiments:
  phase1: ["e1"]
