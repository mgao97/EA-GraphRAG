project:
  name: EA-GraphRAG
  phase: 1
  seed: 42
  results_dir: results
  log_dir: logs
dataset:
  name: hotpotqa
  path: data/raw/hotpotqa/questions.json
  synthetic_path: data/sample_hotpotqa.json
  limit: 50
graph:
  build_from: contexts
  min_entity_len: 2
  max_entities_per_passage: 16
  # Degree-based graph pruning (hub removal). Set 0 to disable.
  max_degree: 100
embedding:
  # text-embedding-3-small served by bianxie.ai through the local proxy
  # (minimax_proxy.py :30001, which forwards /v1/embeddings to bianxie.ai).
  # LLM (everything else) uses MiniMax-M3 via the same proxy.
  backend: openai
  model: text-embedding-3-small
  dim: 1536
  cache_dir: .cache/embeddings
  base_url: http://127.0.0.1:30001/v1
  api_key_env: BIANXIE_API_KEY
  api_key: minimax
llm:
  # MiniMax-M3 via local OpenAI-compatible proxy (minimax_proxy.py on :30001)
  backend: openai
  provider: openai
  model: MiniMax-M3
  temperature: 0.0
  base_url: http://127.0.0.1:30001/v1
  api_key: minimax
  auto_discover_model: false
  max_tokens: 512
controller:
  type: eac
  max_iterations: 6
  sufficiency:
    tau_sem: 0.2
    tau_reason: 0.66
    tau_cons: 0.85
    marginal_gain_threshold: 0.02
  weights:
    semantic: 0.3
    structural: 0.2
    reasoning: 0.4
    consistency: 0.1
  ablation:
    use_semantic: true
    use_structural: true
    use_reasoning: true
    use_consistency: true
retrieval:
  top_k_retrieve: 5
  expand_hops: 2
  bridge_max_hops: 3
  # Beam width for EXPAND (best-first expansion). 0 = unbounded.
  max_nodes_per_hop: 30
  # Dataset-level hop prior for EA-v1 budget compression (HotpotQA ~2-hop).
  # NOT the per-question gold hop_count (fairness).
  hop_prior: 5
baselines:
  fixed_hops:
  - 1
  - 2
  - 3
  - 4
  include:
  - ea_graphrag
experiments:
  phase1:
  - e1
