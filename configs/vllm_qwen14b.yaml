# EA-GraphRAG config: LLM via local vLLM (Qwen2.5-14B-Instruct-1M, :30000),
# embedding via local Ollama (nomic-embed-text, :11434).
# Mirrors configs/minimax.yaml except the LLM backend, so results are directly
# comparable (API: MiniMax-M3 vs local: Qwen2.5-14B).
project:
  name: EA-GraphRAG-vllm-qwen14b
  phase: 1
  seed: 42
  results_dir: results
  log_dir: logs
dataset:
  name: hotpotqa_sample
  path: data/raw/hotpotqa_sample/questions.json
  synthetic_path: data/sample_hotpotqa.json
  limit: 50
graph:
  build_from: contexts
  min_entity_len: 2
  max_entities_per_passage: 16
  max_degree: 100
embedding:
  backend: openai
  model: text-embedding-3-small
  dim: 1536
  cache_dir: .cache/embeddings
  base_url: http://127.0.0.1:30001/v1
  api_key_env: OPENAI_API_KEY
llm:
  backend: openai
  provider: openai
  model: /data/llm/Qwen2.5-14B-Instruct-1M
  temperature: 0.0
  base_url: http://127.0.0.1:30000/v1
  api_key: minimax
  auto_discover_model: false
  max_tokens: 512
controller:
  type: eac
  max_iterations: 6
  sufficiency:
    tau_sem: 0.2
    tau_reason: 0.66
    tau_cons: 0.85
    marginal_gain_threshold: 0.02
  weights:
    semantic: 0.3
    structural: 0.2
    reasoning: 0.4
    consistency: 0.1
  ablation:
    use_semantic: true
    use_structural: true
    use_reasoning: true
    use_consistency: true
retrieval:
  top_k_retrieve: 5
  expand_hops: 2
  bridge_max_hops: 3
  max_nodes_per_hop: 30
  hop_prior: 5
baselines:
  fixed_hops:
  - 1
  - 2
  - 3
  - 4
  include:
  - ea_graphrag
experiments:
  phase1:
  - e1
